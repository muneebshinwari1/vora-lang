name: Bug report
description: Report reproducible incorrect behavior in Vora
title: "[Bug]: "
labels: [bug, triage]
body:
  - type: markdown
    attributes:
      value: Thanks for helping improve Vora. Do not include secrets or private model inputs or outputs.
  - type: textarea
    id: summary
    attributes:
      label: What happened?
      description: Describe the actual behavior and what you expected.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Minimal reproduction
      description: Include the smallest workflow and command that reproduce the issue.
      render: text
    validations:
      required: true
  - type: input
    id: commit
    attributes:
      label: Vora version or commit
      placeholder: 0.3.0 or a42f9be
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      placeholder: Windows version, compiler, CMake version, model provider
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Relevant sanitized output
      description: Remove credentials, personal data, private prompts, and private model outputs.
      render: text
  - type: checkboxes
    id: checks
    attributes:
      label: Checklist
      options:
        - label: I searched existing issues for duplicates.
          required: true
        - label: I removed secrets and private data from this report.
          required: true
