name: Feature request
description: Propose a focused language, runtime, provider, or tooling improvement
title: "[Feature]: "
labels: [enhancement, triage]
body:
  - type: textarea
    id: problem
    attributes:
      label: Workflow problem
      description: What concrete agent workflow is difficult or impossible today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Show proposed syntax and explain execution and failure semantics.
      render: text
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Explain current workarounds and their drawbacks.
  - type: textarea
    id: compatibility
    attributes:
      label: Compatibility and risks
      description: Note effects on workflows, limits, traces, providers, or security.
  - type: checkboxes
    id: checks
    attributes:
      label: Checklist
      options:
        - label: I searched existing issues for similar proposals.
          required: true
        - label: I understand that a request does not guarantee implementation.
          required: true
