name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  native-portable-core:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - name: Configure
        run: cmake -S native -B native/build -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build native/build --parallel 2
      - name: Native tests
        run: ctest --test-dir native/build --output-on-failure
      - name: Portable CLI smoke test
        run: |
          ./native/dist/vora check native/quickstart-fast.vora
          ./native/dist/vora plan native/quickstart-fast.vora
          ./native/dist/vora run native/quickstart-fast.vora --provider demo --input "CI smoke test"

  native-windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v7
      - name: Configure
        run: cmake -S native -B native/build -A x64
      - name: Build
        run: cmake --build native/build --config Release --parallel 2
      - name: Native tests
        run: ctest --test-dir native/build -C Release --output-on-failure
      - name: HTTP and CLI fixture tests
        run: python native/tests/test_http_cli.py

  python-prototype:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Unit tests
        run: python -m unittest discover -s tests -v
