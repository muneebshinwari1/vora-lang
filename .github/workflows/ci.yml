name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  homebrew:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    env:
      HOMEBREW_NO_AUTO_UPDATE: '1'
    steps:
      - uses: actions/checkout@v7
      - name: Install and test source formula
        shell: bash
        run: |
          if [ "$RUNNER_OS" = Linux ]; then eval "$(/home/linuxbrew/.linuxbrew/bin/brew shellenv)"; fi
          brew tap muneebshinwari1/vora "$GITHUB_WORKSPACE"
          if brew commands | rg -q '^trust$'; then brew trust --formula muneebshinwari1/vora/vora; fi
          brew install --build-from-source muneebshinwari1/vora/vora
          brew test muneebshinwari1/vora/vora
      - name: Verify direct installer
        shell: bash
        run: |
          sh -n scripts/install.sh
          VORA_INSTALL_DIR="$RUNNER_TEMP/vora-preview" sh scripts/install.sh
          "$RUNNER_TEMP/vora-preview/bin/vora" --version
          if VORA_INSTALL_DIR="$RUNNER_TEMP/vora-preview" sh scripts/install.sh; then echo 'Existing install unexpectedly overwritten'; exit 1; fi
  native-portable-core:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - name: Linux HTTP dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libcurl4-openssl-dev
      - name: Configure
        run: cmake -S native -B native/build -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build native/build --parallel 2
      - name: Native tests
        run: ctest --test-dir native/build --output-on-failure
      - name: HTTP and CLI fixture tests
        run: |
          python3 native/tests/test_http_cli.py
          python3 native/tests/test_state_cli.py
          python3 native/tests/test_tools_cli.py
      - name: Install and package
        run: |
          cmake --install native/build --prefix native/stage
          ./native/stage/bin/vora check native/stage/share/vora/examples/quickstart-fast.vora
          cd native/build && cpack -C Release
      - name: Portable CLI smoke test
        run: |
          ./native/dist/vora check native/quickstart-fast.vora
          ./native/dist/vora plan native/quickstart-fast.vora
          ./native/dist/vora run native/quickstart-fast.vora --provider demo --input "CI smoke test"
      - name: Upload tested package
        uses: actions/upload-artifact@v7
        with:
          name: vora-${{ runner.os }}-${{ runner.arch }}
          path: native/build/vora-*.tar.gz
          if-no-files-found: error
          retention-days: 30

  native-windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v7
      - name: Configure
        run: cmake -S native -B native/build -A x64
      - name: Build
        run: cmake --build native/build --config Release --parallel 2
      - name: Native tests
        run: ctest --test-dir native/build -C Release --output-on-failure
      - name: HTTP and CLI fixture tests
        run: |
          python native/tests/test_http_cli.py
          python native/tests/test_state_cli.py
          python native/tests/test_tools_cli.py
      - name: Install and package
        run: |
          cmake --install native/build --config Release --prefix native/stage
          ./native/stage/bin/vora.exe check native/stage/share/vora/examples/quickstart-fast.vora
          if ($LASTEXITCODE -ne 0) { throw 'Installed CLI smoke check failed' }
          cpack --config native/build/CPackConfig.cmake -C Release -B native/packages
          if ($LASTEXITCODE -ne 0) { throw 'Package generation failed' }
      - name: Upload tested package
        uses: actions/upload-artifact@v7
        with:
          name: vora-${{ runner.os }}-${{ runner.arch }}
          path: native/packages/vora-*.zip
          if-no-files-found: error
          retention-days: 30

  python-prototype:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Unit tests
        run: python -m unittest discover -s tests -v
