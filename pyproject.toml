[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vora-workflow-prototype"
version = "0.1.0"
description = "Experimental declarative graph workflows for AI agents"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
vora = "vora.cli:main"

[tool.setuptools]
packages = ["vora"]
